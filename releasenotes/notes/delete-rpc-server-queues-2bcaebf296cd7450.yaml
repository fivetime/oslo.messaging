---
features:
  - |
    A new ``oslo_messaging.rpc.server.delete_rpc_server_queues`` API was added.
    This API is currently implemented in RabbitMQ driver and is no-op in
    the other drivers. When this API is called, RabbitMQ driver deletes
    the queue the RPC servers of ``target.topic`` share and,
    if ``target.server`` is set, that server's queue, with any messages left
    in them, and the topic's fanout stream when ``rabbit_stream_fanout`` is
    set (an ordinary fanout queue expires on its own once unused, a stream
    does not). It is meant for a topic that will not be used again, such as one
    named after a resource that has been deleted: RabbitMQ keeps those queues
    once their consumers are gone, so applications that use a topic per
    resource left two queues behind for each resource they deleted.
